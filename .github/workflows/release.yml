name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: fsr-rs
            asset_suffix: linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: fsr-rs
            asset_suffix: macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: fsr-rs
            asset_suffix: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: fsr-rs.exe
            asset_suffix: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          STAGING_DIR=$(mktemp -d)
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} "$STAGING_DIR/"
          cp -r http "$STAGING_DIR/"
          cp -r lua "$STAGING_DIR/"
          ZIP_NAME="fsr-rs-${GITHUB_REF_NAME}-${{ matrix.asset_suffix }}.zip"
          (cd "$STAGING_DIR" && zip -r "$ZIP_NAME" .)
          mv "$STAGING_DIR/$ZIP_NAME" .
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $StagingDir = New-Item -ItemType Directory -Path "staging"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" -Destination $StagingDir
          Copy-Item "http" -Destination $StagingDir -Recurse
          Copy-Item "lua" -Destination $StagingDir -Recurse
          $ZipName = "fsr-rs-$($env:GITHUB_REF_NAME)-${{ matrix.asset_suffix }}.zip"
          Compress-Archive -Path "$StagingDir/*" -DestinationPath $ZipName
          echo "ZIP_NAME=$ZipName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsr-rs-${{ matrix.asset_suffix }}
          path: ${{ env.ZIP_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip
